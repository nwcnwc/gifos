name = "gifos-pay"
main = "src/pay.js"
compatibility_date = "2026-01-01"

# STATELESS — no Durable Objects, no KV, no database. Everything a receipt
# needs rides inside the PayPal order itself; /receipt asks PayPal, never a
# store of ours. A sale is three requests (checkout, webhook-or-return,
# receipt), which is why this fits the same free plan as relay/cors-proxy/
# mirror at any volume GifOS will plausibly see (docs/payments.md).
#
# SECRETS (wrangler secret put …): PAYPAL_CLIENT_SECRET, GIFOS_PAY_SIGN_JWK.
# GIFOS_PAY_SIGN_JWK's public half MUST be site/gifos.key — the OS verifies
# every receipt against the site's published key.

[vars]
PAYPAL_BASE = "https://api-m.sandbox.paypal.com"   # SANDBOX until the mainnet flag day
TREASURY_EMAIL = "payments@gifos.app"
FEE_BPS = "300"
CATALOG_URL = "https://gifos.app/apps/index.json"
RETURN_BASE = "https://pay.gifos.app"
# The x402 facilitator. The x402.org one settles Base Sepolia with NO
# credentials — which is why the testnet x402 rail needs no CDP keys at all.
# The mainnet flag day swaps this for CDP's facilitator (authed), same wire.
FACILITATOR_URL = "https://x402.org/facilitator"
# PAYPAL_CLIENT_ID is a var (it is public by nature); set it at deploy.

# Branded domain — TWO bindings, same rationale as relay/wrangler.toml:
# routes beat custom domains when both match, so the explicit zone route keeps
# this Worker immune to any future wildcard on another Worker.
[[routes]]
pattern = "pay.gifos.app"
custom_domain = true

[[routes]]
pattern = "pay.gifos.app/*"
zone_name = "gifos.app"
