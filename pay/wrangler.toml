name = "gifos-pay"
main = "src/pay.js"
compatibility_date = "2026-01-01"
# No *.workers.dev hostname: the zone's rate-limit and bot rules (scripts/
# cloudflare-harden.sh) match the custom domain, and a second door would
# sit outside them. A fork that wants workers.dev flips this.
workers_dev = false

# STATELESS — no Durable Objects, no KV, no database. Everything a receipt
# needs rides inside the PayPal order itself; /receipt asks PayPal, never a
# store of ours. A sale is three requests (checkout, webhook-or-return,
# receipt), which is why this fits the same free plan as relay/cors-proxy/
# mirror at any volume GifOS will plausibly see (docs/payments.md).
#
# SECRETS (wrangler secret put …): PAYPAL_CLIENT_SECRET, GIFOS_PAY_SIGN_JWK,
# STRIPE_SECRET_KEY (the agent rail; sk_test_ until the mainnet flag day).
# GIFOS_PAY_SIGN_JWK is the Worker's OWN key (node pay/gen-key.mjs); its public
# half is site/gifos-pay.key, which the OS verifies every receipt against. It
# is NOT site/gifos.key: the app-provenance key never enters a Worker
# (docs/threat-model.md § 2). GIFOS_PAY_PUBKEY below pins the expected public
# half — init refuses to start with any other secret.

[vars]
GIFOS_PAY_PUBKEY = "WRwI2n/ztCDo6EsFAHfj0AVc1K2/GywGvNOfaEHW150="   # = site/gifos-pay.key
PAYPAL_BASE = "https://api-m.sandbox.paypal.com"   # SANDBOX until the mainnet flag day
TREASURY_EMAIL = "payments@gifos.app"
TREASURY_ADDRESS = "0x1111111111111111111111111111111111111111"   # the x402 fee leg (Base Sepolia TEST address, = the broker's TREASURY)
FEE_BPS = "300"
# PayPal's platform-partner approval. Until it is "approved" the PayPal rail
# stays closed: PayPal refuses every order that carries platform_fees
# (422 PLATFORM_FEES_NOT_SUPPORTED, measured 2026-09-28).
PAYPAL_PARTNER = "pending"
# THE KILL SWITCH: signing identities ("example.com", "a@b.co") or single apps
# ("example.com/<appId>") this Worker refuses to take payments for. The store
# is never consulted — any validly signed app can be paid unless it is here.
BLOCKED = "[]"
RETURN_BASE = "https://pay.gifos.app"
# The x402 facilitator. The x402.org one settles Base Sepolia with NO
# credentials — which is why the testnet x402 rail needs no CDP keys at all.
# The mainnet flag day swaps this for CDP's facilitator (authed), same wire.
FACILITATOR_URL = "https://x402.org/facilitator"
# Wallet-transfer rail: any public Base Sepolia RPC works — the Worker only
# READS Transfer logs, it never sends or holds anything.
BASE_RPC = "https://sepolia.base.org"
# FedNow: unset until a provider account exists (Finzly-shaped; see README).
# FEDNOW_API = ""
FEDNOW_PAYEES = "{}"
# The rails registry: identities allowed on the FEE-FREE rails (annual
# registration; fee not yet set). Committed to the site like the catalog.
REGISTRY_URL = "https://gifos.app/pay/registry.json"
# The AGENT rail (MPP + Stripe Shared Payment Tokens, docs/payments.md §FIVE
# RAILS): unset until the platform's Stripe profile exists. The profile id is
# public by nature (agents' wallets scope tokens to it); the key is a secret.
# STRIPE_PROFILE_ID = "profile_test_…"
# Authors onboarded for destination charges: signing identity -> acct_….
STRIPE_PAYEES = "{}"
# The PayPal REST app's client ID — public by nature (it ships in every PayPal
# button). SANDBOX app "gifos-pay"; its secret is PAYPAL_CLIENT_SECRET.
PAYPAL_CLIENT_ID = "BAAhbyY1zsQopKGzUKBQIx-06EA39p-VYaReH1fdSRiKhF_va2KrZA28h77DPB97P6RJf64uqP7F-xFwuI"

# The vendored tweetnacl (via gifos-ed.js, which gifos-sign.js verifies app
# signatures through) names Node's `crypto` in a branch a Worker never takes
# (self.crypto always exists here). The bundler must still resolve it: an
# empty stand-in, rather than nodejs_compat's whole Node surface.
[alias]
"crypto" = "./src/no-node-crypto.js"

# THE AUDIT TRAIL. Workers Logs keeps every console line this Worker writes,
# searchable in the dashboard (Workers & Pages → gifos-pay → Logs). core.js
# writes one JSON line per money event ({"audit":"gifos-pay","ev":…}):
# started, receipt, captured, refused, provider-refused. Retention is the
# plan's (3 days free, 7 paid); the providers' own records (PayPal, Stripe,
# the chain) are the permanent ones, and every line carries their reference.
[observability]
enabled = true
head_sampling_rate = 1

# Branded domain — TWO bindings, same rationale as relay/wrangler.toml:
# routes beat custom domains when both match, so the explicit zone route keeps
# this Worker immune to any future wildcard on another Worker.
[[routes]]
pattern = "pay.gifos.app"
custom_domain = true

[[routes]]
pattern = "pay.gifos.app/*"
zone_name = "gifos.app"
