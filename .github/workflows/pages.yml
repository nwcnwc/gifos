# Publish ONLY the site/ directory to GitHub Pages (gifos.app).
# Everything else in the repo — tests, relay source, design docs — is
# deliberately outside the publish boundary and never reachable on the domain.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://gifos.app/
    runs-on: ubuntu-latest
    steps:
      # Full history so the edge build number (count of site-touching commits) is
      # accurate — a shallow checkout would report 1.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      # Edge build number: a monotonic counter that bumps on every push touching
      # the site tree. DERIVED (git rev-list count), not a committed counter, so no
      # self-triggering commit loop and it always deploys.
      #
      # ANCHORED: this branch's history was squashed/re-imported, so a raw
      # `rev-list --count` under-counts (the pre-0.8.0 history is collapsed into one
      # commit). We instead count site commits SINCE a known release and add the
      # build number that release was cut from, so the number lines up with the
      # actual project history (0.6.0=31, 0.7.0=268, 0.8.0=280, 0.8.4=825) and keeps
      # climbing.
      #
      # Two rules, both learned the hard way — see the note in the step below:
      #   1. Anchor ONLY to a commit that is pushed to main. The anchor must resolve
      #      in a fresh CI checkout, not just in someone's local clone.
      #   2. Keep this in step with scripts/archive-version.sh, which stamps the
      #      same number into a release snapshot. If the two anchors disagree, the
      #      release and the edge build it was cut from disagree.
      # Bump ANCHOR_* (in BOTH files) when you re-anchor at a future release.
      - name: Stamp edge build number
        run: |
          set -euo pipefail
          # RE-ANCHORED 2026-08-25 after the commit-message history rewrite. The old
          # anchor (b4ada94) was rewritten to ae79e96 — identical tree, identical
          # count — but the OLD sha still resolved in CI from GitHub's retained
          # objects while no longer being an ANCESTOR of main, so `A..HEAD` stopped
          # excluding anything and swept in ~210 extra commits: one deploy stamped
          # 2059 where the true count was 1849. ANCHOR_BUILD carries a permanent
          # +210 offset so the counter never moves BACKWARD past that published
          # 2059. The count itself is unchanged; only the origin of the number is.
          ANCHOR_SHA=ae79e96            # the "release: cut v0.8.4" commit (post-rewrite)
          ANCHOR_BUILD=1035            # 825 the 0.8.4 cut + 210 rewrite offset (see above)
          # The anchor MUST exist in CI's checkout. The previous anchor (3d84267)
          # was a dangling object that lived only in one local clone — it resolved
          # on that machine and was absent here, so `rev-list` failed, the old
          # `|| echo 0` swallowed it, and every deploy silently stamped the anchor
          # itself: the build number went BACKWARD 825 -> 280 and froze there,
          # which broke the Version panel and killed edge update notifications.
          # Never reintroduce a fallback that turns a missing anchor into a number.
          if ! git cat-file -e "${ANCHOR_SHA}^{commit}" 2>/dev/null; then
            echo "::error::ANCHOR_SHA ${ANCHOR_SHA} is not in this checkout — re-anchor pages.yml to a commit that is pushed to main."
            exit 1
          fi
          SINCE=$(git rev-list --count ${ANCHOR_SHA}..HEAD -- site)
          BUILD=$((ANCHOR_BUILD + SINCE))
          echo "edge build = $BUILD (anchor $ANCHOR_BUILD + $SINCE since $ANCHOR_SHA)"
          printf '/* baked at deploy by pages.yml — see site/js/build.js */\nwindow.GIFOS_BUILD = %s;\n' "$BUILD" > site/js/build.js
          node -e "const f='site/version.json',j=JSON.parse(require('fs').readFileSync(f));j.edgeBuild=$BUILD;require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
      # Cache-busting: stamp ?v=<short-sha> onto every LOCAL css/js reference in
      # the published HTML. Each deploy gets a unique version, so a returning
      # browser fetches fresh CSS/JS the moment it loads a new page instead of
      # serving a stale cached asset. Only relative paths match (no ':' → skips
      # http(s) URLs; no '?' → never double-stamps); serving site/ directly in
      # dev is unaffected since static servers ignore the query string.
      - name: Cache-bust local css/js assets
        run: |
          SHA="${GITHUB_SHA::8}"
          # site/versions/ holds FROZEN release snapshots: what is served must
          # be what is committed, so they are excluded from the rewrite.
          find site -path site/versions -prune -o -name '*.html' -print0 \
            | xargs -0 sed -i -E "s/(href|src)=\"([^\":?]+\.(css|js))\"/\1=\"\2?v=${SHA}\"/g"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      # GitHub Pages' backend occasionally returns a transient
      # "Deployment failed, try again later." even though the artifact
      # uploaded fine. Retry the deploy a few times so a platform hiccup
      # never strands the live site on an old build.
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        continue-on-error: true
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        continue-on-error: true
      - id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      # Tell IndexNow-capable engines (Bing, Yandex, Seznam, Naver…) that the
      # site changed. Google doesn't use IndexNow — it discovers via the
      # sitemap + Search Console. Failures here must never fail a deploy.
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"gifos.app","key":"762b4690f472ea2ae0242c947cbc3cc3","keyLocation":"https://gifos.app/762b4690f472ea2ae0242c947cbc3cc3.txt","urlList":["https://gifos.app/","https://gifos.app/about.html","https://gifos.app/llms.txt","https://gifos.app/sitemap.xml"]}' || true
