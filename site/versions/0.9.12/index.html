<!-- Theming gate: hide chrome until the theme cascade (js/gifos-themes.js,
     included in this head so vars land parser-blocking, BEFORE first paint)
     applies real vars, so the purple :root default from desktop.css never
     paints first. The booting backdrop follows the theme's own --bg the moment
     it lands. Reveals the instant --accent is set; a failsafe timeout
     guarantees we never stay hidden if a theme file 404s or hangs. On reveal
     the theme-color meta is synced to --bg so the browser chrome (mobile URL
     bar) matches the theme instead of flashing dark on a light theme. -->
<style id="theme-gate">html.gifos-booting body{visibility:hidden}html.gifos-booting{background:var(--bg,#0a0a0f)}</style>
<script>(function(){var h=document.documentElement;h.className+=(h.className?' ':'')+'gifos-booting';var shown=0;
function show(){if(shown)return;shown=1;h.classList.remove('gifos-booting');
try{var bg=h.style.getPropertyValue('--bg');var m=document.querySelector('meta[name=theme-color]');if(bg&&m)m.setAttribute('content',bg.trim());}catch(e){}}
function chk(){if(shown)return;if(h.style.getPropertyValue('--accent'))show();else requestAnimationFrame(chk);}
requestAnimationFrame(chk);setTimeout(show,1500);})();</script>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
<!-- CHANNEL LOADER — runs before any app code. The site root (/) is the UNRELEASED
     edge build; releases are immutable /versions/<x.y.z>/ snapshots. A fresh
     visitor follows the live-release pointer (version.json.current); '?edge' opts
     into the root edge build; a pin sticks to one snapshot. '?stable'/'?unpin'
     returns to the default release channel. Snapshots under /versions/ never
     redirect again. The pointer read is synchronous so the redirect happens
     before any app code runs (no flash, no wasted boot); after the first visit
     it's a cached fast path. Keep this snippet identical across the entry pages. -->
<script>
window.GIFOS_VERSION = '0.9.12';
(function () {
  // THE CHANNEL DECISION, exposed as a callable so it can be tested directly
  // (test/browser/e2e.js). Returns null to stay on this build, {redirect:<url>}
  // to move, or {clear:true} when ?stable/?unpin/?latest just cleared a pin and
  // there is nowhere to go. The three lines at the bottom are the ONLY caller in
  // the page, so a test of this function is a test of what actually ships —
  // when this hook was dropped during a loader redesign, e2e.js's five pinning
  // assertions died as a TypeError and version pinning silently lost its guard.
  function pinTarget(pathname, search, hash) {
    pathname = pathname || '/'; search = search || ''; hash = hash || '';
    if (pathname.indexOf('/versions/') !== -1) return null;   // immutable build — never redirect
    var q; try { q = new URLSearchParams(search); } catch (e) { q = null; }
    // Flags may arrive IN THE HASH: the 404 pretty-URL router folds the query
    // into the hash it builds (/meet/<room>?edge -> /run.html#v=<room>&edge),
    // so a channel flag must be honored from either place.
    function has(k) { return !!(q && q.has(k)) || new RegExp('[#&]' + k + '(&|=|$)').test(hash); }
    var cleared = false;
    try {
      if (has('edge')) { localStorage.setItem('gifos_channel', 'edge'); localStorage.removeItem('gifos_pin'); }
      if (has('stable') || has('unpin') || has('latest')) { localStorage.removeItem('gifos_channel'); localStorage.removeItem('gifos_pin'); cleared = true; }
    } catch (e) {}
    var pin = null, chan = null, cur = null;
    try { pin = localStorage.getItem('gifos_pin'); chan = localStorage.getItem('gifos_channel'); cur = localStorage.getItem('gifos_current'); } catch (e) {}
    var stay = cleared ? { clear: true } : null;
    // A PRETTY router path (/meet/<room>, /join/<code>[/…]) is NOT a
    // file — Pages 404s it and 404.html routes it to a real page. If we ever run at
    // one (an offline cached shell, or any substitution of index.html), prepending
    // /versions/<v> would build /versions/<v>/meet/<room>, which exists nowhere, and
    // bounce the visitor to the desktop with their invite silently dropped. So
    // translate a pretty path to its real target instead of decorating it. Room case
    // is PRESERVED: the room id is the capability the key derives from.
    //
    // FLAG DAY 2026-08-05 (prelaunch, NO SHIMS): snapshots are addressed as
    // run.html, PERIOD. The runtime was renamed meet.html -> run.html on
    // 2026-08-04 and the compat shim is DELETED — snapshots cut before 0.9.3
    // ship their runtime as meet.html and are therefore NO LONGER
    // loader-addressable (deliberate: prelaunch, nobody real is pinned, and a
    // per-version filename table is exactly the compat rot we refuse to
    // carry). Old meet.html#... links are dead the same way.

    var pm = pathname.match(/^\/(?:join|meet|cast)\/([a-zA-Z0-9-]{1,64})(?:\/([a-fA-F0-9]{16,64})(?:\/([a-zA-Z0-9]{1,64}))?)?\/?$/);
    var here;
    if (pm) {
      here = /^\/(?:meet|cast)\//.test(pathname)
        ? '/run.html#v=' + pm[1] + (pm[2] ? '&av=' + pm[2].toLowerCase() : '') + (/^\/cast\//.test(pathname) ? '&bc=1' : '')
        : '/run.html#' + (pm[2] && pm[3] ? 's=' + pm[1] + '.' + pm[2].toLowerCase() + '&k=' + pm[3] : 'j=' + pm[1]);
    } else {
      // Carry the page + invite hash across (snapshots ship run.html too —
      // flag day above) AND THE QUERY. The query used to be dropped here,
      // which silently broke the one link built for strangers:
      // gifos.app/?run=<gif url> ("open this app"). A first visit is exactly
      // when the release redirect fires, so the visitor most likely to follow
      // a shared run-link was the one guaranteed to lose it — they landed on
      // a bare Home Screen with nothing said. It must be the QUERY and not
      // the hash (the usual doctrine) for one decisive reason: released
      // snapshots are immutable, and 0.9.5's desktop.js reads ?run= from
      // location.search. Carrying the hash instead would fix nothing until
      // the NEXT release, for links sent today.
      here = pathname + search + hash;
    }
    function to(v) { return { redirect: '/versions/' + v + here }; }
    if (pin && pin !== window.GIFOS_VERSION) return to(pin);  // pinned to a DIFFERENT snapshot
    if (pin) return stay;                                     // already running what we're pinned to
    if (chan === 'edge') return stay;                         // opted into the edge build → run this root
    // Default channel follows the live release — but only on the real domain. On
    // localhost / preview hosts the root IS what you're developing, so stay edge.
    if (!/(^|\.)gifos\.app$/.test(location.hostname)) return stay;
    if (cur) return to(cur);                                  // default, fast path (last-known release)
    // Default, first visit: resolve the release pointer, then redirect. On failure
    // (offline, no cache) fall through and run this edge build.
    try {
      var x = new XMLHttpRequest(); x.open('GET', '/version.json?ts=' + Date.now(), false); x.send();
      var v = ''; try { v = (JSON.parse(x.responseText) || {}).current || ''; } catch (e) {}
      if (v) { try { localStorage.setItem('gifos_current', v); } catch (e) {} return to(v); }
    } catch (e) {}
    return stay;
  }
  window.gifosPinTarget = pinTarget;
  var decision = pinTarget(location.pathname, location.search, location.hash);
  if (decision && decision.redirect) location.replace(decision.redirect);
})();
</script>
