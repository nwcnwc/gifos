<!DOCTYPE html>
<html lang="en">
<head>
<base href="/versions/0.9.2/">
<meta charset="UTF-8">
<!--
  meet.html — a PERMANENT redirect shim to run.html.

  The runtime was named meet.html until it stopped being only a meeting: the
  one-runtime work made the same page the local app runner, the app-room host
  and the broadcast skin, so it is now run.html. This file cannot be deleted:

    * Invite links in the wild point here. buildJoinUrl()'s non-prod form is
      <origin>/meet.html#j=<code>&relay=… — handed out to every user on a
      CUSTOM RELAY (pretty /join/… paths have nowhere to carry &relay=) and to
      every self-hosted / local deploy. Those links were texted and bookmarked.
    * Installed apps opened as meet.html#id=<fileId>, and app GIFs that baked a
      link still carry that form.
    * Archived /versions/<x.y.z>/ builds address their own runtime as meet.html
      (0.8.x additionally ships an OLD, unrelated run.html — the pre-one-runtime
      app runner), and the root channel loader therefore keeps sending pinned
      users to /versions/<v>/meet.html. Shipping this shim inside every future
      snapshot keeps that one address correct for every version, past and future.

  So this is not a migration aid to delete later; it is the stable public name.

  The redirect is RELATIVE ('run.html'), never '/run.html': inside a snapshot
  this must land on /versions/<x.y.z>/run.html, not the root edge build.
  location.replace keeps it out of the back-button history, and the query AND
  hash both carry across — the hash is where every invite capability lives.
-->
<meta name="robots" content="noindex">
<title>Meeting — GifOS</title>
<!-- The link-preview card lives here too: a scraper fetching a shared
     meet.html link runs no JS, so it never follows the redirect below and would
     otherwise unfurl a blank page. Same card as run.html. og:url is deliberately
     OMITTED so scrapers use the actual fetched URL and keep the invite's
     subdomain (the computer's theme). -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="GifOS">
<meta property="og:title" content="Join the meeting on GifOS">
<meta property="og:description" content="Peer-to-peer video, right in your browser. One link — no account, no installs.">
<meta property="og:image" content="https://gifos.app/meet-og.png">
<meta property="og:image:width" content="2400">
<meta property="og:image:height" content="1260">
<meta property="og:image:alt" content="Join the meeting on GifOS — one link, no account, no installs.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Join the meeting on GifOS">
<meta name="twitter:description" content="Peer-to-peer video in your browser. One link · no account · no installs.">
<meta name="twitter:image" content="https://gifos.app/meet-og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B9%3C/text%3E%3C/svg%3E">
<script>
(function () {
  // Relative on purpose — see the header note. Query and hash both survive.
  location.replace('run.html' + location.search + location.hash);
})();
</script>
<!-- No-JS / scraper fallback: a real person with JS off still gets there. -->
<noscript><meta http-equiv="refresh" content="0; url=run.html"></noscript>
<style>
  html, body { height: 100%; margin: 0; background: #0a0a0f; color: #8888aa;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  .m { display: flex; height: 100%; align-items: center; justify-content: center; font-size: .9rem; }
  a { color: #7b5cff; }
</style>
</head>
<body>
  <div class="m"><p>Opening… <a href="run.html">continue</a></p></div>
</body>
</html>
