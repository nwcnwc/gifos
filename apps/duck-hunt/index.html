<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pond Hunt</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gate">
  <div class="gate-box">
    <h1>Pond Hunt</h1>
    <p class="sub">Click the ducks. The dog laughs.</p>
    <button id="gate-go" type="button" disabled>Play</button>
    <p class="keys">Tap a duck. Three shots a wave. On a phone the tap is the zapper.</p>
    <p class="best" id="best"></p>
    <p class="room" id="gate-room">Press Invite in the bar above. A friend sits their own pond — two zappers, one scoreboard.</p>
  </div>
</div>
<div id="hud" hidden>
  <button type="button" id="btn-pause">Pause</button>
  <button type="button" id="btn-mute">Mute</button>
  <span id="best-live"></span>
</div>
<div id="tally" hidden></div>
<div id="pond" hidden></div>
<script src="vendor/assets.js"></script>
<script src="fetch-hook.js"></script>
<script src="vendor/duckhunt.js"></script>
<script src="boot.js"></script>
</body>
</html>
