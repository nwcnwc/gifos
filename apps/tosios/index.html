<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>TOSIOS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- Touch: shown only after a real finger has touched the screen — a laptop
     with a touchscreen must not get a phone HUD laid over its game. -->
<div id="touch" hidden>
  <div id="t-move" class="t-stick"><div class="t-knob"></div></div>
  <div id="t-look"></div>
  <button class="t-btn" id="t-fire">FIRE</button>
</div>

<div id="score" hidden><table><tbody id="score-rows"></tbody></table></div>
<div id="tally" hidden></div>
<div id="hint"><b>WASD</b> move · <b>mouse</b> aim · <b>click</b> / <b>space</b> fire · <b>Tab</b> scores</div>

<!-- Order matters: the runtime inlines each <script src> where it stands. -->
<script src="net.js"></script>
<script src="app.js"></script>
</body>
</html>
