<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>Spider</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><span class="logo" aria-hidden="true"></span> Spider</div>
  <div class="stats">
    <span id="score">500</span>
    <span class="dot">·</span>
    <span id="found">0</span>/8
    <span class="dot">·</span>
    <span id="record">0–0</span>
  </div>
</header>
<div class="top">
  <div class="foundations" id="foundations" aria-label="Finished runs"></div>
  <button type="button" id="stock" class="stockpiles" aria-label="Deal a row">
    <span class="stock-stack" id="stockStack"></span>
    <span class="stock-n" id="stockN">5</span>
  </button>
</div>
<div class="diff" role="group" aria-label="Suits">
  <button type="button" data-suits="1" id="d1">1 suit</button>
  <button type="button" data-suits="2" id="d2">2 suits</button>
  <button type="button" data-suits="4" id="d4">4 suits</button>
</div>
<div class="tableau" id="tableau"></div>
<div class="bar">
  <button type="button" id="undo">Undo</button>
  <button type="button" id="hint">Hint</button>
  <button type="button" id="new">New</button>
</div>
<p class="msg" id="msg"></p>
<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-labelledby="ov-title">
    <p id="ov-title"></p>
    <p class="ov-sub" id="ov-sub"></p>
    <div class="ov-row">
      <button type="button" id="ov-no">Keep playing</button>
      <button type="button" id="ov-yes" class="primary">New game</button>
    </div>
  </div>
</div>
<div class="ghost" id="ghost" hidden></div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
