<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>InvaderZ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="canvas" width="240" height="480"></canvas>
</div>

<div id="hud">
  <div>ARROWS / A D  MOVE  SPACE FIRE</div>
  <div>ENTER RESTART</div>
</div>

<div id="tally" hidden></div>
<div id="score" hidden>
  <table>
    <thead><tr><th>cannon</th><th>kills</th></tr></thead>
    <tbody id="score-rows"></tbody>
  </table>
</div>

<div id="touch" hidden>
  <div id="t-left" class="t-col">
    <button class="t-btn" data-key="left" type="button">LEFT</button>
    <button class="t-btn" data-key="right" type="button">RIGHT</button>
  </div>
  <div id="t-right" class="t-col">
    <button class="t-btn wide" data-key="space" type="button">FIRE</button>
  </div>
</div>

<script src="vendor/Invader.js"></script>
<script src="vendor/Player.js"></script>
<script src="vendor/Genetics.js"></script>
<script src="game.js"></script>
<script src="net.js"></script>
<script src="touch.js"></script>
<script src="boot.js"></script>
</body>
</html>
