<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Word Master</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <button type="button" class="icon-btn" id="settingsBtn" aria-label="Settings">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
    </button>
    <h1>WORD MASTER</h1>
    <span class="hdr-pad" aria-hidden="true"></span>
  </header>

  <div id="versus" class="versus" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <div class="board-wrap">
    <div id="board" class="board" aria-label="Guesses"></div>
    <button type="button" id="playAgain" class="again" hidden>Play Again</button>
  </div>

  <div id="keyboard" class="keyboard"></div>
</div>

<div id="modal-settings" class="modal" hidden>
  <div class="sheet" role="dialog" aria-labelledby="setTitle">
    <button type="button" class="icon-btn close" data-close="settings" aria-label="Close">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
    <h2 id="setTitle">Settings</h2>
    <label class="toggle">
      <input type="checkbox" id="darkToggle">
      <span>Dark mode</span>
    </label>
    <p class="label">Difficulty</p>
    <div class="seg" id="diffSeg">
      <button type="button" data-diff="easy">Easy</button>
      <button type="button" data-diff="normal">Normal</button>
      <button type="button" data-diff="hard">Hard</button>
    </div>
    <p class="hint" id="diffHint"></p>
  </div>
</div>

<div id="modal-end" class="modal" hidden>
  <div class="sheet end-sheet" role="dialog" aria-labelledby="endTitle">
    <button type="button" class="icon-btn close" data-close="end" aria-label="Close">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
    <div id="endBody"></div>
    <button type="button" id="endAgain" class="again">Play Again</button>
  </div>
</div>

<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
