<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>Blackjack</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><span class="logo" aria-hidden="true"></span> Blackjack</div>
  <div class="chips">Chips <span id="chips">200</span></div>
</header>
<p class="rules">Dealer stands on 17 &middot; Blackjack pays 3:2</p>
<div class="felt">
  <p class="felt-idle" id="feltIdle">Beat the dealer to 21 without going over.</p>
  <section class="dealer" id="dealer">
    <h2>Dealer <span id="dTotal">~</span></h2>
    <div class="cards" id="dCards"></div>
  </section>
  <section class="you" id="pHands"></section>
  <div class="seats" id="seats"></div>
</div>
<p class="who" id="who" hidden></p>
<p class="msg" id="msg">Deal when you are ready.</p>
<div class="bar">
  <button type="button" id="deal" aria-label="Deal">Deal · 10</button>
  <button type="button" id="hit" hidden aria-label="Hit">Hit</button>
  <button type="button" id="stand" hidden aria-label="Stand">Stand</button>
  <button type="button" id="double" hidden aria-label="Double">Double</button>
  <button type="button" id="split" hidden aria-label="Split">Split</button>
  <button type="button" id="refill" hidden aria-label="Restock chips">Restock 200</button>
</div>
<p class="hint">Hit, stand, double, or split a pair. Extra seats join this table. Stake 10.</p>
<script src="bj.js"></script>
<script src="app.js"></script>
</body>
</html>
