<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pong</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="bar">
    <div id="leftName">YOU</div>
    <div id="best"></div>
    <button id="soundBtn" type="button" aria-label="Sound">♪</button>
    <div id="rightName">CPU</div>
  </div>
  <div id="play">
    <div id="court">
      <canvas id="game">Sorry, this game needs a canvas.</canvas>
    </div>
  </div>
  <div id="hint">Tap to play · drag your paddle</div>
  <div id="pads" hidden>
    <button type="button" data-dir="up" aria-label="Paddle up">▲</button>
    <button type="button" data-dir="down" aria-label="Paddle down">▼</button>
  </div>
</div>
<!-- Order matters: the runtime inlines each <script src> where it stands. -->
<script src="vendor/game.js"></script>
<script src="vendor/pong.js"></script>
<script src="boot.js"></script>
</body>
</html>
