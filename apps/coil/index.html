<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Coil</title>
<link href="vendor/reset.css" rel="stylesheet">
<link href="vendor/main.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<script id="vertexShader" type="x-shader/x-vertex">
attribute vec2 position;
varying vec2 pos;
void main() {
  pos = position;
  gl_Position = vec4(position.x, position.y, 0.0, 1.0);
}
</script>
<script id="fragmentShader" type="x-shader/x-fragment">
#ifdef GL_ES
precision highp float;
#endif
varying vec2 pos;
uniform vec2 mouse;
uniform vec2 resolution;
uniform float time;
uniform sampler2D texture;
uniform vec3 e0; uniform vec3 e1; uniform vec3 e2; uniform vec3 e3; uniform vec3 e4;
uniform vec3 e5; uniform vec3 e6; uniform vec3 e7; uniform vec3 e8; uniform vec3 e9;
float distance(vec2 p1, vec2 p2) {
  float dx = p1.x-p2.x; float dy = p1.y-p2.y; return sqrt(dx*dx + dy*dy);
}
float lightEffect(vec3 e, vec2 p) {
  if (e.z == 0.0) return 0.0;
  vec2 ep = -1.0 + 2.0 * e.xy / resolution.xy;
  float dist = (1.0 - min(distance(ep, p) * 2.0, 1.0));
  return dist * 0.3 * e.z;
}
vec2 deformEffect(vec3 e, vec2 p) {
  if (e.z == 0.0) return vec2(0.0, 0.0);
  vec2 ep = -1.0 + 2.0 * e.xy / resolution.xy;
  float dist = (1.0 - min(distance(ep, p) * 2.0, 1.0));
  vec2 offset = vec2(dist * (p.x-ep.x) * cos(time), dist * (p.y-ep.y) * sin(time));
  return offset * e.z * 0.5;
}
void main(void) {
  vec2 p = -1.0 + 2.0 * gl_FragCoord.xy / resolution.xy;
  vec2 m = -1.0 + 2.0 * mouse.xy / resolution.xy;
  p.y = -p.y;
  float light = 0.0;
  light += lightEffect(e0, p); light += lightEffect(e1, p); light += lightEffect(e2, p);
  light += lightEffect(e3, p); light += lightEffect(e4, p); light += lightEffect(e5, p);
  light += lightEffect(e6, p); light += lightEffect(e7, p); light += lightEffect(e8, p);
  light += lightEffect(e9, p);
  light += (1.0 - (distance(m, p))) * 0.08;
  light = min(light, 1.0);
  vec2 uv = pos;
  uv += deformEffect(e0, p); uv += deformEffect(e1, p); uv += deformEffect(e2, p);
  uv += deformEffect(e3, p); uv += deformEffect(e4, p); uv += deformEffect(e5, p);
  uv += deformEffect(e6, p); uv += deformEffect(e7, p); uv += deformEffect(e8, p);
  uv += deformEffect(e9, p);
  vec3 col = texture2D(texture, uv).xyz * light;
  gl_FragColor = vec4(col, 0.8 * light);
}
</script>
</head>
<body>
<div id="game">
  <canvas id="effects"></canvas>
  <canvas id="world"></canvas>
  <p id="lag-warning">Looks like the game is running slowly. <a href="#">Disable grid effects?</a></p>
  <div id="menu">
    <h1>Coil</h1>
    <div id="score">
      <h3>Your Score:</h3>
      <p>0</p>
    </div>
    <p id="best"></p>
    <section class="welcome">
      <h2>Instructions</h2>
      <p>Enclose the blue orbs before they explode. Gain bonus points by enclosing multiple orbs at once. Drag a trail with a finger or the mouse.</p>
      <a class="button" id="start-button" href="#">Start Game</a>
    </section>
  </div>
</div>
<script src="vendor/jquery.min.js"></script>
<script src="vendor/assets.js"></script>
<script src="vendor/util.js"></script>
<script src="vendor/coil.js"></script>
<script src="boot.js"></script>
</body>
</html>
