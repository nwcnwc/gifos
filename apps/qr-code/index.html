<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QR Code</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>QR Code</h1>
    <p class="lead">Type a link or any text. A code appears.</p>
  </header>

  <div id="kinds" class="kinds" role="tablist" aria-label="What to encode">
    <button type="button" class="kind on" data-kind="text" role="tab" aria-selected="true">Text</button>
    <button type="button" class="kind" data-kind="url" role="tab" aria-selected="false">Link</button>
    <button type="button" class="kind" data-kind="phone" role="tab" aria-selected="false">Phone</button>
    <button type="button" class="kind" data-kind="sms" role="tab" aria-selected="false">SMS</button>
    <button type="button" class="kind" data-kind="email" role="tab" aria-selected="false">Email</button>
    <button type="button" class="kind" data-kind="contact" role="tab" aria-selected="false">Contact</button>
  </div>

  <div id="fields"></div>
  <p id="count" class="count" hidden></p>

  <article id="card" class="card">
    <div id="empty" class="empty-state">
      <div class="ghost-qr" aria-hidden="true"></div>
      <p>Type something to draw a code.</p>
    </div>
    <div id="qr" class="qr" hidden aria-label="QR code"></div>
    <p id="caption" class="caption" hidden></p>
    <p id="err" class="err" hidden></p>
    <p id="warn" class="warn" hidden></p>
  </article>

  <div class="actions">
    <button type="button" id="pngBtn" disabled>Download PNG</button>
    <button type="button" id="copyBtn" class="ghost" disabled>Copy picture</button>
    <button type="button" id="printBtn" class="ghost" disabled>Print</button>
  </div>

  <details id="looks">
    <summary>Size and colours</summary>
    <fieldset>
      <legend>Error correction</legend>
      <label class="radio"><input type="radio" name="ecc" value="L"> L — smallest</label>
      <label class="radio"><input type="radio" name="ecc" value="M" checked> M — default</label>
      <label class="radio"><input type="radio" name="ecc" value="Q"> Q — tougher</label>
      <label class="radio"><input type="radio" name="ecc" value="H"> H — toughest</label>
    </fieldset>
    <label class="num">Size
      <input type="range" id="size" min="128" max="320" step="16" value="224">
      <span id="sizeVal">224</span>
    </label>
    <div class="colors">
      <label>Dark <input type="color" id="dark" value="#000000"></label>
      <label>Light <input type="color" id="light" value="#ffffff"></label>
    </div>
  </details>

  <section id="recents" class="recents" hidden>
    <h2>Recent</h2>
    <ul id="recentList"></ul>
  </section>

  <p id="meet" class="meet">Press <b>Invite</b> (top bar) to show this code in a meeting.</p>
</div>

<div id="print-area" hidden></div>

<!-- Order matters: the runtime inlines each <script src> where it stands. -->
<script src="vendor/qrcode.js"></script>
<script src="mp.js"></script>
<script src="app.js"></script>
</body>
</html>
