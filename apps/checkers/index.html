<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Checkers</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><span class="logo" aria-hidden="true"></span> Checkers</div>
  <div class="engine-chip" id="aiChip"><span class="dot"></span><span id="aiState">Ready</span></div>
</header>

<main>
  <section class="card setup" id="setup">
    <h2>New game</h2>
    <label class="row">Play
      <div class="seg" id="modeSeg">
        <button type="button" data-mode="cpu" class="on">Computer</button>
        <button type="button" data-mode="hotseat">Two here</button>
      </div>
    </label>
    <div id="cpuOpts">
      <label class="row">You play
        <div class="seg" id="colorSeg">
          <button type="button" data-color="white" class="on">○ White</button>
          <button type="button" data-color="black">● Black</button>
        </div>
      </label>
      <p class="lvlnote" id="cpuNote">You play white and go first. The computer plays black. It thinks on this device.</p>
    </div>
    <p class="lvlnote" id="hotseatNote" hidden>Pass the device. White goes first. Tap a piece, then tap where it goes.</p>
    <button class="primary" id="startBtn" type="button">Start game</button>
    <button class="ghost wide" id="friendBtn" type="button">👥 Play a friend</button>
  </section>

  <section class="game" id="game" hidden>
    <div class="scoreline" id="scoreLine"><span class="wht">○ 20</span><span class="blk">● 20</span></div>
    <div class="statusline" id="statusLine">Your turn.</div>
    <div class="boardwrap"><div class="board" id="board" aria-label="Checkers board"></div></div>
    <div class="controls">
      <button id="undoBtn" class="ghost" type="button">↶ Undo</button>
      <button id="newBtn" class="ghost" type="button">＋ New game</button>
    </div>
  </section>

  <section class="game" id="friend" hidden>
    <div class="vhead"><h2>Play a friend</h2><button class="ghost" id="fLeave" type="button">← Leave</button></div>
    <div class="seats" id="fSeats"></div>
    <div class="fqueue" id="fQueue"></div>
    <div class="scoreline" id="fScore"><span class="wht">○ 20</span><span class="blk">● 20</span></div>
    <div class="statusline" id="fStatus"></div>
    <div class="boardwrap"><div class="board" id="fBoard" aria-label="Shared Checkers board"></div></div>
    <div class="controls">
      <button id="fResign" class="ghost" type="button" hidden>🏳 Resign</button>
    </div>
  </section>
</main>

<script src="board.js"></script>
<script src="vendor/ai.js"></script>
<script src="app.js"></script>
</body>
</html>
