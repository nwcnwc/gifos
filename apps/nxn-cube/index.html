<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>NxN Cube</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <div class="brand">NxN Cube</div>
  <label class="size">Size
    <select id="order" aria-label="Cube size">
      <option value="2">2×2 Pocket</option>
      <option value="3" selected>3×3</option>
      <option value="4">4×4</option>
      <option value="5">5×5</option>
      <option value="6">6×6</option>
      <option value="7">7×7</option>
      <option value="8">8×8</option>
      <option value="9">9×9</option>
      <option value="10">10×10</option>
    </select>
  </label>
  <button type="button" id="scramble">Scramble</button>
  <button type="button" class="ghost" id="restore">Restore</button>
  <div class="stat"><span id="moves">0</span> moves</div>
  <div class="stat" id="status">Solved</div>
</header>

<div id="main">
  <div id="stage" aria-label="Cube"></div>
  <aside id="side">
    <h2>Race</h2>
    <p id="race-note">Scramble, then Invite from the GifOS bar. Everyone gets the same shuffle. First to solved wins.</p>
    <ol id="board"></ol>
  </aside>
</div>

<script src="vendor/cube.js"></script>
<script src="boot.js"></script>
</body>
</html>
