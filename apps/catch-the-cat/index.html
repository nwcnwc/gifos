<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catch the Cat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <div id="status">Tap the dots. Wall the cat in.</div>
    <div id="clicks">0 taps</div>
  </header>
  <div id="stage">
    <div id="scene">
      <div id="plate">
        <div id="cells"></div>
        <div id="cats"></div>
      </div>
    </div>
    <div id="viewbar">
      <button type="button" id="flat" title="Lay the board flat">Flat</button>
      <button type="button" id="recenter" title="Put the board back">Reset view</button>
    </div>
    <div id="flash" hidden></div>
  </div>
  <div id="roster" hidden></div>
  <div id="modes" hidden>
    <button type="button" data-mode="race">Race</button>
    <button type="button" data-mode="coop">Team</button>
  </div>
  <div id="bar">
    <button type="button" id="undo">Undo</button>
    <button type="button" id="again">New board</button>
  </div>
</div>
<script src="vendor/phaser.js"></script>
<script src="vendor/game.js"></script>
<script src="engine.js"></script>
<script src="view.js"></script>
<script src="rules.js"></script>
<script src="net.js"></script>
<script src="boot.js"></script>
</body>
</html>
