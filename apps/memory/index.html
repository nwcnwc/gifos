<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Memory</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>Memory</h1>
    <span id="best">Best 0</span>
    <span id="score">Score 0</span>
  </header>
  <div id="versus" hidden>
    <div id="pills"></div>
    <p id="vsNote"></p>
  </div>
  <p id="status">Watch the pads, then tap them back.</p>
  <div id="board" class="n4"></div>
  <div class="bar">
    <button type="button" id="start">Start</button>
    <button type="button" id="mute" aria-pressed="false">Sound on</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
