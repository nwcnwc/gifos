<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pixel It</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<img id="pixelitimg" alt="" hidden>
<div class="wrap">
  <header>
    <h1>Pixel It</h1>
    <p class="lead">Photo to pixel art on this device.</p>
  </header>

  <div id="stage" class="stage">
    <div id="empty" class="empty">
      <div class="empty-ico" aria-hidden="true">▣</div>
      <p class="empty-title">No photo yet</p>
      <p class="empty-copy">Take a still or open a picture. The conversion runs here — the file never leaves this device.</p>
      <div class="empty-actions">
        <button type="button" id="emptyPhoto">Take photo</button>
        <button type="button" id="emptyChoose" class="ghost">Choose a picture</button>
        <button type="button" id="sampleBtn" class="ghost">Try a sample</button>
      </div>
    </div>
    <canvas id="pixelitcanvas" hidden></canvas>
    <canvas id="origcanvas" hidden></canvas>
    <p id="holdhint" class="holdhint" hidden>Hold to see the original</p>
  </div>

  <div id="work" class="work" hidden>
    <div class="row">
      <button type="button" id="photoBtn">Take photo</button>
      <button type="button" id="chooseBtn" class="ghost">Choose</button>
      <button type="button" id="saveBtn" class="ghost">Download PNG</button>
    </div>

    <section class="controls">
      <label>Block size <span id="blockvalue">8</span>
        <input type="range" id="blocksize" min="1" max="50" value="8">
      </label>
      <div class="toggles">
        <label class="chk"><input type="checkbox" id="greyscale"> Greyscale</label>
        <label class="chk"><input type="checkbox" id="palette" checked> Use palette</label>
      </div>
      <p id="sizehint" class="hint"></p>
    </section>

    <section class="palettes">
      <div class="row-head">Palette</div>
      <div id="palettelist"></div>
    </section>
  </div>

  <input type="file" id="file" accept="image/*">
  <p id="status" role="status"></p>
  <p class="foot">Unofficial port of Pixel It by giventofly. The picture never leaves this device.</p>
</div>
<script src="vendor/pixelit.js"></script>
<script src="app.js"></script>
</body>
</html>
