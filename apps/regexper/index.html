<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Regexper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">
    <h1>Regexper</h1>
    <span>You thought you only had two problems&hellip;</span>
  </div>
</header>

<main id="content">
  <div class="application">
    <form id="regexp-form">
      <textarea id="regexp-input" rows="3" autofocus placeholder="Enter a JavaScript-style regular expression to display"></textarea>
      <button type="submit">Display</button>
      <ul class="inline-list">
        <li class="download-svg">
          <a href="#" class="inline-icon" data-action="download-svg" download="image.svg" type="image/svg+xml"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 8 8"><use xlink:href="#data-transfer-download"></use></svg>Download SVG</a>
        </li>
        <li class="download-png">
          <a href="#" class="inline-icon" data-action="download-png" download="image.png" type="image/png"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 8 8"><use xlink:href="#data-transfer-download"></use></svg>Download PNG</a>
        </li>
        <li class="permalink">
          <a href="#" class="inline-icon" data-action="permalink"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 8 8"><use xlink:href="#link-intact"></use></svg>Permalink</a>
        </li>
      </ul>
    </form>
  </div>
  <div class="results">
    <div id="error"></div>
    <ul id="warnings"></ul>
    <div id="regexp-render"></div>
  </div>
</main>

<footer>
  <ul class="inline-list">
    <li>Unofficial port of <b>Regexper</b> by javallone (MIT)</li>
    <li>Diagrams drawn on this device.</li>
  </ul>
  <script type="text/html" id="svg-container-base">
    <div class="svg">
      <svg xmlns="http://www.w3.org/2000/svg" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" version="1.1">
        <defs>
          <style type="text/css">
svg { background-color: #fff; }
.root text, .root tspan { font: 12px Arial, Helvetica, sans-serif; }
.root path { fill-opacity: 0; stroke-width: 2px; stroke: #000; }
.root circle { fill: #6b6659; stroke-width: 2px; stroke: #000; }
.anchor text, .any-character text { fill: #fff; }
.anchor rect, .any-character rect { fill: #6b6659; }
.escape text, .charset-escape text, .literal text { fill: #000; }
.escape rect, .charset-escape rect { fill: #bada55; }
.literal rect { fill: #dae9e5; }
.charset .charset-box { fill: #cbcbba; }
.subexp .subexp-label tspan,
.charset .charset-label tspan,
.match-fragment .repeat-label tspan { font-size: 10px; }
.repeat-label { cursor: help; }
.subexp .subexp-label tspan,
.charset .charset-label tspan { dominant-baseline: text-after-edge; }
.subexp .subexp-box {
  stroke: #908c83;
  stroke-dasharray: 6,2;
  stroke-width: 2px;
  fill-opacity: 0;
}
.quote { fill: #908c83; }
          </style>
        </defs>
        <metadata>
          <rdf:RDF>
            <cc:License rdf:about="http://creativecommons.org/licenses/by/3.0/">
              <cc:permits rdf:resource="http://creativecommons.org/ns#Reproduction" />
              <cc:permits rdf:resource="http://creativecommons.org/ns#Distribution" />
              <cc:requires rdf:resource="http://creativecommons.org/ns#Notice" />
              <cc:requires rdf:resource="http://creativecommons.org/ns#Attribution" />
              <cc:permits rdf:resource="http://creativecommons.org/ns#DerivativeWorks" />
            </cc:License>
          </rdf:RDF>
        </metadata>
      </svg>
    </div>
    <div class="progress"><div style="width:0;"></div></div>
  </script>
</footer>

<svg xmlns="http://www.w3.org/2000/svg" id="open-iconic">
  <!-- Icons from Open Iconic https://useiconic.com/open/ (MIT) -->
  <defs>
    <g id="data-transfer-download">
      <path d="M3 0v3h-2l3 3 3-3h-2v-3h-2zm-3 7v1h8v-1h-8z" />
    </g>
    <g id="link-intact">
      <path d="M5.88.03c-.18.01-.36.03-.53.09-.27.1-.53.25-.75.47a.5.5 0 1 0 .69.69c.11-.11.24-.17.38-.22.35-.12.78-.07 1.06.22.39.39.39 1.04 0 1.44l-1.5 1.5c-.44.44-.8.48-1.06.47-.26-.01-.41-.13-.41-.13a.5.5 0 1 0-.5.88s.34.22.84.25c.5.03 1.2-.16 1.81-.78l1.5-1.5c.78-.78.78-2.04 0-2.81-.28-.28-.61-.45-.97-.53-.18-.04-.38-.04-.56-.03zm-2 2.31c-.5-.02-1.19.15-1.78.75l-1.5 1.5c-.78.78-.78 2.04 0 2.81.56.56 1.36.72 2.06.47.27-.1.53-.25.75-.47a.5.5 0 1 0-.69-.69c-.11.11-.24.17-.38.22-.35.12-.78.07-1.06-.22-.39-.39-.39-1.04 0-1.44l1.5-1.5c.4-.4.75-.45 1.03-.44.28.01.47.09.47.09a.5.5 0 1 0 .44-.88s-.34-.2-.84-.22z" />
    </g>
    <g id="warning">
      <path d="M3.09 0c-.06 0-.1.04-.13.09l-2.94 6.81c-.02.05-.03.13-.03.19v.81c0 .05.04.09.09.09h6.81c.05 0 .09-.04.09-.09v-.81c0-.05-.01-.14-.03-.19l-2.94-6.81c-.02-.05-.07-.09-.13-.09h-.81zm-.09 3h1v2h-1v-2zm0 3h1v1h-1v-1z" />
    </g>
  </defs>
</svg>

<script src="app.js"></script>
<script src="vendor/regexper.js"></script>
</body>
</html>
