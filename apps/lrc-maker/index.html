<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LRC Maker</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="shell">
    <header id="hud">
      <div id="brand">LRC Maker</div>
      <div id="clock">00:00.00</div>
    </header>
    <p id="track">No song yet — pick one. It stays in this file.</p>
    <div id="seek-wrap">
      <input id="seek" type="range" min="0" max="0" step="0.01" value="0" aria-label="Seek" disabled>
    </div>
    <div class="actions" id="tools">
      <label class="file">Song<input id="audioFile" type="file" accept="audio/*"></label>
      <label class="file">Open LRC<input id="lrcFile" type="file" accept=".lrc,text/plain"></label>
      <button type="button" id="exportBtn">Export LRC</button>
      <button type="button" id="editBtn">Edit lyrics</button>
      <button type="button" id="shareBtn">Look together</button>
    </div>
    <div id="friend-bar" hidden>
      <p id="friend-hint">Press <b>Invite</b> in the bar above to send a friend the link. They get the lyrics and stamps, not the song file.</p>
      <p id="friend-status"></p>
      <ul id="friend-scores"></ul>
      <div class="friend-actions"><button type="button" id="leaveBtn">← Solo</button></div>
    </div>
    <ul id="lines"></ul>
    <div id="editor" hidden>
      <label class="sr" for="lyrics">Lyrics</label>
      <textarea id="lyrics" placeholder="Paste unsung lyrics here, one line each."></textarea>
    </div>
    <p id="err" class="err" hidden></p>
    <div id="dock">
      <button type="button" id="backBtn" aria-label="Skip back 5 seconds">−5s</button>
      <button type="button" id="playBtn">Play</button>
      <button type="button" id="fwdBtn" aria-label="Skip forward 5 seconds">+5s</button>
      <button type="button" id="stampBtn">Stamp</button>
    </div>
  </div>
  <script src="vendor/lrc-parser.js"></script>
  <script src="app.js"></script>
  <script src="mp.js"></script>
</body>
</html>
