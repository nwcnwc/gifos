<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>IsoCity</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <link rel="stylesheet" href="vendor/main.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="chrome">
    <div id="brand">IsoCity</div>
    <div id="actions">
      <button type="button" id="shareBtn">Share the map</button>
      <button type="button" id="compareBtn">Compare cities</button>
      <button type="button" id="undoBtn" disabled>Undo</button>
      <button type="button" id="newBtn">New city</button>
    </div>
  </div>

  <p id="hint">Pick a tile, then tap the map. Drag to pan. Pinch to zoom (Ctrl+scroll on a computer).</p>

  <div id="friend-bar" hidden>
    <p id="friend-hint">Press <b>Invite</b> in the bar above the app to send the link.</p>
    <p id="friend-status"></p>
    <ul id="friend-roster"></ul>
    <div class="friend-actions">
      <button type="button" id="mineBtn" hidden>Back to mine</button>
      <button type="button" id="leaveBtn">← Solo</button>
    </div>
  </div>

  <section id="main">
    <div id="tools-wrap">
      <div id="tools"></div>
      <p id="toolName">Trees</p>
    </div>
    <div id="area">
      <div id="stage">
        <canvas id="bg"></canvas>
        <canvas id="fg"></canvas>
      </div>
    </div>
  </section>

  <div id="confirm-new" hidden>
    <div class="confirm-box">
      <p>Wipe this city? Empty dirt, nothing left.</p>
      <div class="confirm-actions">
        <button type="button" id="confirm-no">Keep it</button>
        <button type="button" id="confirm-yes">New city</button>
      </div>
    </div>
  </div>

  <img id="texSheet" src="vendor/textures/01_130x66_130x230.png" alt="" hidden>

  <script src="vendor/main.js"></script>
  <script src="pan.js"></script>
  <script src="mp.js"></script>
  <script src="app.js"></script>
</body>
</html>
