<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>One Stroke</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><span class="logo" aria-hidden="true"></span> One Stroke</div>
  <div class="hdr-actions">
    <div class="engine-chip" id="chip"><span class="dot"></span><span id="chipText">Your turn</span></div>
    <button class="ghost tiny" id="soloFriends" type="button">With friends</button>
    <button class="ghost tiny" id="fLeave" type="button" hidden>← Solo</button>
  </div>
</header>

<main>
  <section class="studio" id="solo">
    <div class="paper mine" id="soloPaper">
      <p class="statusline turn" id="soloStatus">Your turn. One line.</p>
      <canvas id="soloPad" width="720" height="720" aria-label="Your page"></canvas>
      <div class="hint" id="soloHint">
        <svg class="ghost-stroke" viewBox="0 0 100 56" aria-hidden="true">
          <path d="M8 38 C 26 8, 48 50, 70 18 S 94 16, 92 28" pathLength="1"></path>
        </svg>
        <div class="hint-copy">
          <b>Draw one line</b>
          <span>Lift, then send it. That’s the whole turn.</span>
        </div>
      </div>
    </div>
    <div class="tools">
      <div class="inkbar" id="soloInk"></div>
      <div class="widths" id="soloWidths"></div>
    </div>
    <div class="controls empty" id="soloControls">
      <button class="ghost pendish" id="soloUndo" type="button">Undo</button>
      <button class="primary slim pendish" id="soloSend" type="button">That’s my stroke</button>
      <button class="ghost loopish" id="soloPlay" type="button">Play loop</button>
      <button class="ghost loopish" id="soloNew" type="button">New page</button>
    </div>
    <form class="titlebox" id="soloTitleForm" autocomplete="off" hidden>
      <label>Title
        <input id="soloTitleIn" maxlength="40" placeholder="Untitled">
      </label>
    </form>
  </section>

  <section class="studio" id="friend" hidden>
    <div class="seats" id="fSeats"></div>
    <p class="fqueue" id="fQueue"></p>
    <div class="paper" id="fPaper">
      <p class="statusline" id="fStatus">Setting up the page…</p>
      <canvas id="fPad" width="720" height="720" aria-label="Shared page"></canvas>
      <div class="hint" id="fHint" hidden>
        <svg class="ghost-stroke" viewBox="0 0 100 56" aria-hidden="true">
          <path d="M8 38 C 26 8, 48 50, 70 18 S 94 16, 92 28" pathLength="1"></path>
        </svg>
        <div class="hint-copy">
          <b>Your turn. One line.</b>
          <span>Lift, then send it. Nobody else may draw until you do.</span>
        </div>
      </div>
      <div class="wait-banner" id="fWait" hidden>
        <b id="fWaitName">A friend</b>
        <span id="fWaitMsg">is drawing the next line</span>
      </div>
      <div class="vote" id="fVote" hidden>
        <p class="vote-lead">Name this picture</p>
        <div class="vote-list" id="fVoteList"></div>
        <form class="titlebox" id="fVoteForm" autocomplete="off">
          <label>Or write one
            <input id="fVoteIn" maxlength="40" placeholder="A custom title">
          </label>
          <button class="primary slim" id="fVoteGo" type="submit">Vote</button>
        </form>
      </div>
    </div>
    <div class="tools">
      <div class="inkbar" id="fInk"></div>
      <div class="widths" id="fWidths"></div>
    </div>
    <div class="controls empty" id="fControls">
      <button class="ghost pendish" id="fUndo" type="button">Undo</button>
      <button class="primary slim pendish" id="fSend" type="button">That’s my stroke</button>
      <button class="ghost loopish" id="fPlay" type="button">Play loop</button>
      <button class="ghost loopish" id="fAgain" type="button" hidden>Another round</button>
      <button class="ghost loopish" id="fNew" type="button" hidden>New page</button>
    </div>
  </section>
</main>

<script src="game.js"></script>
<script src="app.js"></script>
</body>
</html>
