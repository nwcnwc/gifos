<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pivot</title>
<link rel="stylesheet" href="vendor/pivot.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pivot</h1>
    <p class="lead">Put fields on rows and columns. The last table comes back next time.</p>
  </header>

  <section class="toolbar" aria-label="Load a table">
    <label class="file">
      Choose a CSV
      <input id="file" type="file" accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values,text/plain">
    </label>
    <button type="button" id="sample">Reset sample</button>
    <button type="button" id="blank">New blank</button>
    <button type="button" id="copyTable">Copy table</button>
    <span id="status" class="status">Canadian MPs sample</span>
  </section>

  <details class="paste-wrap" id="pasteWrap">
    <summary>Paste or type comma-separated text</summary>
    <textarea id="csv" rows="4" spellcheck="false" placeholder="item,region,qty&#10;Widget,East,12"></textarea>
  </details>

  <section id="assign" class="assign" aria-label="Field layout">
    <p class="assign-lead">On a phone, pick a role for each field. On a computer, you can also drag the chips on the grid.</p>
    <div id="assignFields"></div>
    <div class="assign-opts">
      <label>Summarise
        <select id="aggSel"></select>
      </label>
      <label>View
        <select id="renSel"></select>
      </label>
    </div>
  </section>

  <p id="error" class="err" hidden></p>
  <p id="copyMsg" class="hint" hidden></p>
  <div id="output" class="output"></div>
</div>

<script src="vendor/jquery.min.js"></script>
<script src="vendor/jquery-ui.min.js"></script>
<script src="vendor/jquery.ui.touch-punch.min.js"></script>
<script src="vendor/papaparse.min.js"></script>
<script src="vendor/pivot.js"></script>
<script src="vendor/export_renderers.js"></script>
<script src="vendor/sample.js"></script>
<script src="app.js"></script>
</body>
</html>
