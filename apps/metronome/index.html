<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Metronome</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="pyramid" id="pyramid" aria-hidden="true">
    <div class="py-body">
      <div class="py-window">
        <div class="py-arm" id="pendArm"><i class="py-bob"></i></div>
      </div>
    </div>
    <div class="py-base"></div>
  </div>

  <div class="tempo-row">
    <button type="button" id="tempoDown" class="step" aria-label="Slower">−</button>
    <div class="tempo-read">
      <div class="tempo-num">
        <span class="bpm" id="bpm">120</span>
        <span class="unit">BPM</span>
      </div>
      <div class="mark" id="mark">Allegro</div>
    </div>
    <button type="button" id="tempoUp" class="step" aria-label="Faster">+</button>
  </div>
  <label class="num host-only">Tempo
    <input type="range" id="tempo" min="30" max="240" step="1" value="120">
  </label>
  <div class="marks host-only" id="marks" role="group" aria-label="Tempo marks"></div>

  <div id="beats" class="beats" aria-hidden="true"></div>

  <div class="actions">
    <button type="button" id="playBtn">Start</button>
    <button type="button" id="tapBtn" class="ghost">Tap tempo</button>
  </div>

  <fieldset class="host-only">
    <legend>Signature</legend>
    <div class="chips" id="sigs">
      <button type="button" data-sig="2/4">2/4</button>
      <button type="button" data-sig="3/4">3/4</button>
      <button type="button" data-sig="4/4" class="on">4/4</button>
      <button type="button" data-sig="6/8">6/8</button>
    </div>
  </fieldset>

  <fieldset class="host-only">
    <legend>Subdivision</legend>
    <div class="chips" id="subs">
      <button type="button" data-sub="beat" class="on">Beat</button>
      <button type="button" data-sub="8th">8ths</button>
      <button type="button" data-sub="trip">Triplets</button>
      <button type="button" data-sub="16th">16ths</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>Sound</legend>
    <div class="chips" id="sounds">
      <button type="button" data-sound="click" class="on">Click</button>
      <button type="button" data-sound="beep">Beep</button>
    </div>
  </fieldset>

  <label class="num">Volume
    <input type="range" id="vol" min="0" max="100" step="1" value="80">
  </label>
  <p id="meet" class="meet">Press <b>Invite</b> (top bar) to show these numbers in a meeting. Each device plays its own click.</p>
</div>

<script src="mp.js"></script>
<script src="app.js"></script>
</body>
</html>
