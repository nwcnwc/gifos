<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Waveforms</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="stage">
    <canvas id="wave" width="640" height="220" aria-label="Waveform graph"></canvas>
    <canvas id="air" width="640" height="120" hidden aria-label="Air molecules"></canvas>
    <div class="stage-bar">
      <button type="button" id="hearBtn">Hear</button>
      <span id="hz">110 Hz</span>
      <button type="button" id="pauseBtn" class="ghost">Pause</button>
    </div>
  </div>
  <div id="copy"></div>
  <div class="shapes" id="shapeRow" hidden>
    <button type="button" class="chip" data-shape="sine" aria-pressed="true">
      <canvas class="mini" data-mini="sine" width="72" height="28"></canvas>
      Sine
    </button>
    <button type="button" class="chip" data-shape="triangle" aria-pressed="false">
      <canvas class="mini" data-mini="triangle" width="72" height="28"></canvas>
      Triangle
    </button>
    <button type="button" class="chip" data-shape="square" aria-pressed="false">
      <canvas class="mini" data-mini="square" width="72" height="28"></canvas>
      Square
    </button>
    <button type="button" class="chip" data-shape="sawtooth" aria-pressed="false">
      <canvas class="mini" data-mini="sawtooth" width="72" height="28"></canvas>
      Saw
    </button>
  </div>
  <select id="shape" hidden aria-hidden="true" tabindex="-1">
    <option value="sine">Sine</option>
    <option value="triangle">Triangle</option>
    <option value="square">Square</option>
    <option value="sawtooth">Sawtooth</option>
  </select>
  <section class="controls" id="controls">
    <label id="ampRow">Amplitude <span id="ampVal">1.00</span>
      <input type="range" id="amp" min="0" max="1" step="0.01" value="1">
    </label>
    <label id="freqRow">Frequency <span id="freqVal">1.0 cycles</span>
      <input type="range" id="freq" min="0.5" max="4" step="0.1" value="1">
    </label>
    <label id="harmRow" hidden>Harmonics <span id="harmVal">0</span>
      <input type="range" id="harm" min="0" max="12" step="1" value="0">
    </label>
    <label id="convRow" hidden>Converge <span id="convVal">0.00</span>
      <input type="range" id="conv" min="0" max="1" step="0.01" value="0">
    </label>
    <label id="volRow">Volume <span id="volVal">0.00</span>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0">
    </label>
  </section>
  <p id="status" role="status"></p>
  <div class="nav">
    <button type="button" id="backBtn" class="ghost">Back</button>
    <div class="mid">
      <span id="stepn"></span>
      <div id="dots" class="dots" aria-hidden="true"></div>
    </div>
    <button type="button" id="nextBtn">Next</button>
  </div>
</div>
<script src="vendor/waveform.js"></script>
<script src="app.js"></script>
</body>
</html>
