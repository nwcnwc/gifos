<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JPG Glitch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>JPG Glitch</h1>
    <p class="lead">Databend a still on this device. Nothing is uploaded.</p>
  </header>

  <div id="drop" class="drop">
    <div class="drop-ico" aria-hidden="true">▧</div>
    <p><b>Drop a picture here</b> or tap to choose</p>
    <p class="hint">JPEG, PNG, WebP. On a phone, Take photo is easier.</p>
  </div>
  <input type="file" id="file" accept="image/*">

  <div class="row">
    <button type="button" id="photoBtn">Take photo</button>
    <button type="button" id="saveBtn" class="ghost">Download JPEG</button>
    <button type="button" id="randBtn" class="ghost">Random seed</button>
  </div>

  <section class="controls">
    <label>Amount <span id="amountVal">24</span>
      <input type="range" id="amount" min="0" max="99" value="24">
    </label>
    <label>Seed <span id="seedVal">53</span>
      <input type="range" id="seed" min="0" max="100" value="53">
    </label>
    <label>Iterations <span id="iterVal">21</span>
      <input type="range" id="iterations" min="0" max="100" value="21">
    </label>
    <label>Quality <span id="qualVal">46</span>
      <input type="range" id="quality" min="1" max="99" value="46">
    </label>
  </section>

  <div class="stage">
    <canvas id="out"></canvas>
  </div>
  <p id="status" role="status"></p>
  <p class="foot">Unofficial port of jpg-glitch by snorpey. The picture never leaves this device.</p>
</div>
<script src="vendor/glitch-canvas.js"></script>
<script src="app.js"></script>
</body>
</html>
