<div id="root"><div class="boot">Opening…</div></div>
<!-- Order matters: the runtime inlines each <script src> as a classic script.
     shim.js is a memory localStorage so upstream never throws on the opaque
     origin; vendor/excalidraw.js is the IIFE (React + Excalidraw); app.js is
     the GifOS shell (gifos.db persistence, no collab). -->
<script src="shim.js"></script>
<script src="vendor/excalidraw.js"></script>
<script src="app.js"></script>
</body>
