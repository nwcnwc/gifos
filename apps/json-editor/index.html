<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JSON Editor</title>
<link rel="stylesheet" href="vendor/jsoneditor.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <h1>JSON Editor</h1>
    <p class="lead">Tree or code, side by side. Your document stays on this device.</p>
  </header>

  <div class="mode-tabs phone-tabs" role="tablist" aria-label="Mode">
    <button type="button" id="tabTree" class="tab on" aria-selected="true">Tree</button>
    <button type="button" id="tabCode" class="tab" aria-selected="false">Code</button>
  </div>

  <div class="actions">
    <button type="button" id="newBtn">New</button>
    <button type="button" id="sampleBtn">Sample</button>
    <button type="button" id="formatBtn">Format</button>
    <button type="button" id="compactBtn">Compact</button>
    <button type="button" id="repairBtn">Repair</button>
    <button type="button" id="copyBtn">Copy</button>
    <label class="file">Open
      <input id="file" type="file" accept=".json,application/json,text/plain">
    </label>
  </div>

  <p id="err" class="err" hidden></p>
  <p id="hint" class="hint">Nothing in this file yet. Paste JSON in Code, or tap Sample.</p>
  <div id="editor" class="editor"></div>
  <p id="status" class="status">The document stays in this file.</p>
  <p id="meet" class="meet">Press <b>Invite</b> (top bar) to let a meeting watch this document, read-only. Nothing is uploaded.</p>
</div>

<script src="vendor/jsoneditor.min.js"></script>
<script src="mp.js"></script>
<script src="app.js"></script>
</body>
</html>
