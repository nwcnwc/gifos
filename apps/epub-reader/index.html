<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EPUB Reader</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="bar">
    <label class="chip" for="file-input">Open</label>
    <input type="file" id="file-input" accept="application/epub+zip,.epub">
    <button type="button" class="chip" id="toc-toggle">Contents</button>
    <button type="button" class="chip" id="prev" aria-label="Previous page">‹</button>
    <span id="pager" class="pager">
      <span id="place">1 / 1</span>
    </span>
    <button type="button" class="chip" id="next" aria-label="Next page">›</button>
    <span class="gap"></span>
    <button type="button" class="chip" id="font-down" aria-label="Smaller type">A−</button>
    <button type="button" class="chip" id="font-up" aria-label="Larger type">A+</button>
    <button type="button" class="chip" id="point-toggle" aria-pressed="false">Point</button>
    <button type="button" class="chip" id="find-toggle">Find</button>
  </header>

  <div id="findbar" hidden>
    <input type="search" id="find" placeholder="Find in this chapter" autocomplete="off" enterkeyhint="search">
    <span id="find-count"></span>
    <button type="button" class="chip" id="find-prev" aria-label="Previous match">Prev</button>
    <button type="button" class="chip" id="find-next" aria-label="Next match">Next</button>
    <button type="button" class="chip" id="find-close" aria-label="Close find">Done</button>
  </div>

  <div id="stage">
    <aside id="toc" hidden>
      <p class="toc-title">Contents</p>
      <nav id="toc-list"></nav>
    </aside>
    <div id="paper">
      <div class="sheet">
        <div id="flow" class="flow"></div>
      </div>
      <div id="pointer" class="pointer" hidden></div>
    </div>
    <div id="empty" class="empty">
      <p>Open an EPUB</p>
      <p class="hint">It stays on this device. Press Invite in the bar above and a friend follows the page.</p>
      <label class="btn" for="file-input">Choose file</label>
    </div>
    <div id="spinner" class="spinner" hidden></div>
  </div>

  <p id="status" class="status"></p>
  <p id="meet" class="meet">Press <b>Invite</b> in the bar above to read together. They land on your page. Press <b>Point</b>, then hold a line.</p>
</div>

<!-- Order matters: the runtime inlines each <script src> where it stands. -->
<script src="vendor/jszip.min.js"></script>
<script src="vendor/epub.min.js"></script>
<script src="sample.js"></script>
<script src="viewer.js"></script>
<script src="net.js"></script>
<script src="touch.js"></script>
<script src="boot.js"></script>
</body>
</html>
