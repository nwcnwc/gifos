<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Milkdown</title>
<link rel="stylesheet" href="vendor/milkdown.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <h1>Milkdown</h1>
    <p class="lead">Type markdown. See the page. The document lives in this file.</p>
  </header>

  <div class="mode-tabs" role="tablist" aria-label="View">
    <button type="button" id="tabWrite" class="tab on" aria-selected="true">Write</button>
    <button type="button" id="tabSource" class="tab" aria-selected="false">Source</button>
  </div>

  <div id="toolbar" class="toolbar" role="toolbar" aria-label="Format">
    <button type="button" id="btnBold" aria-label="Bold" title="Bold"><b>B</b></button>
    <button type="button" id="btnItalic" aria-label="Italic" title="Italic">I</button>
    <button type="button" id="btnStrike" aria-label="Strikethrough" title="Strikethrough"><s>S</s></button>
    <button type="button" id="btnCode" aria-label="Inline code" title="Inline code">&lt;/&gt;</button>
    <span class="split"></span>
    <button type="button" id="btnH1" aria-label="Heading 1" title="Heading 1">H1</button>
    <button type="button" id="btnH2" aria-label="Heading 2" title="Heading 2">H2</button>
    <button type="button" id="btnQuote" aria-label="Quote" title="Quote">“</button>
    <button type="button" id="btnBullet" aria-label="Bullet list" title="Bullet list">•</button>
    <button type="button" id="btnOrdered" aria-label="Numbered list" title="Numbered list">1.</button>
    <button type="button" id="btnTask" aria-label="Task" title="Task">☐</button>
    <button type="button" id="btnCodeBlock" aria-label="Code block" title="Code block">{ }</button>
    <button type="button" id="btnTable" aria-label="Table" title="Table">▦</button>
    <button type="button" id="btnHr" aria-label="Divider" title="Divider">—</button>
    <button type="button" id="btnLink" aria-label="Link" title="Link">link</button>
  </div>

  <div class="actions">
    <button type="button" id="sampleBtn">Sample</button>
    <button type="button" id="copyBtn">Copy</button>
    <button type="button" id="newBtn">New</button>
    <label class="file">Open
      <input id="file" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain">
    </label>
  </div>

  <p id="err" class="err" hidden></p>

  <div id="stage" class="stage">
    <div id="paper" class="paper"></div>
    <textarea id="source" class="source" hidden spellcheck="true" aria-label="Markdown source"></textarea>
  </div>

  <p id="status" class="status">The document stays in this file.</p>
  <p id="meet" class="meet">Press <b>Invite</b> (top bar) to write the same document with a friend. Nothing is uploaded.</p>
</div>

<div id="linkSheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-labelledby="linkTitle">
    <h2 id="linkTitle">Link</h2>
    <label>Address
      <input id="linkHref" type="url" inputmode="url" placeholder="example.com/note" autocomplete="off">
    </label>
    <div class="sheet-actions">
      <button type="button" id="linkCancel">Cancel</button>
      <button type="button" id="linkApply" class="primary">Apply</button>
    </div>
  </div>
</div>

<script src="vendor/milkdown.js"></script>
<script src="mp.js"></script>
<script src="app.js"></script>
</body>
</html>
