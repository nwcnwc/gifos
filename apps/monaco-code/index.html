<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monaco Code</title>
<link rel="stylesheet" href="vendor/monaco.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <button type="button" id="filesBtn" class="icon-btn" aria-label="Files" aria-expanded="false">Files</button>
    <div class="titles">
      <h1>Monaco Code</h1>
      <p class="lead">The buffers live in this file. Invite is a pair editor.</p>
    </div>
    <div class="actions">
      <button type="button" id="findBtn">Find</button>
      <button type="button" id="formatBtn">Format</button>
      <button type="button" id="newBtn">New</button>
      <label class="file">Open
        <input id="open" type="file" multiple>
      </label>
      <button type="button" id="moreBtn" class="icon-btn" aria-label="More" aria-expanded="false">More</button>
    </div>
  </header>

  <div id="moreMenu" class="menu" hidden>
    <button type="button" id="renameBtn">Rename</button>
    <button type="button" id="deleteBtn">Delete</button>
    <button type="button" id="downloadBtn">Download</button>
    <button type="button" id="wrapBtn">Word wrap</button>
    <label class="menu-row">Theme
      <select id="themeSel">
        <option value="vs-dark">Dark</option>
        <option value="vs">Light</option>
        <option value="hc-black">High contrast</option>
      </select>
    </label>
    <label class="menu-row">Language
      <select id="langSel"></select>
    </label>
  </div>

  <div class="work">
    <aside id="sidebar" class="sidebar">
      <div class="side-head">
        <span>Files</span>
        <button type="button" id="newSideBtn" class="tiny">New</button>
      </div>
      <nav id="fileList" class="file-list" aria-label="Files"></nav>
    </aside>
    <div class="stage">
      <div id="tabs" class="tabs" role="tablist" aria-label="Open files"></div>
      <div id="editor" class="editor" role="application" aria-label="Code editor"></div>
      <p id="empty" class="empty" hidden>No files yet. Tap <b>New</b> or <b>Open</b>, or wait a moment for the sample project.</p>
    </div>
  </div>

  <footer class="bar">
    <span id="pos">Ln 1, Col 1</span>
    <span id="langPill">plaintext</span>
    <span id="status" class="status">Starting editor…</span>
    <span id="meet" class="meet">Press <b>Invite</b> (top bar) to pair-edit these files. Nothing is uploaded.</span>
  </footer>
</div>

<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <p id="modalTitle">Name</p>
    <input id="modalInput" type="text" autocomplete="off" spellcheck="false">
    <p id="modalMsg" class="err" hidden></p>
    <div class="row">
      <button type="button" id="modalOk">OK</button>
      <button type="button" id="modalCancel">Cancel</button>
    </div>
  </div>
</div>

<script src="workers.js"></script>
<script src="vendor/monaco.js"></script>
<script src="net.js"></script>
<script src="app.js"></script>
</body>
</html>
