<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Paint Board</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="chrome">
    <div id="brand">Paint Board</div>
    <div id="actions">
      <button type="button" id="shareBtn">Draw together</button>
      <button type="button" id="undoBtn">Undo</button>
      <button type="button" id="redoBtn">Redo</button>
      <button type="button" id="saveBtn">Save PNG</button>
      <button type="button" id="newBtn">New picture</button>
    </div>
  </div>

  <div id="friend-bar" hidden>
    <p id="friend-hint">Press <b>Invite</b> (GifOS menu) to send the link. Everyone paints on the same board.</p>
    <p id="friend-status"></p>
    <ul id="friend-roster"></ul>
    <div class="friend-actions">
      <button type="button" id="leaveBtn">← Solo</button>
    </div>
  </div>

  <div id="tools">
    <div id="brushes" role="toolbar" aria-label="Brushes"></div>
    <div id="swatches" role="listbox" aria-label="Colours"></div>
    <label id="width-wrap">Width
      <input type="range" id="width" min="2" max="32" value="10">
    </label>
  </div>

  <div id="stage">
    <canvas id="paper"></canvas>
  </div>

  <script src="board.js"></script>
  <script src="mp.js"></script>
  <script src="app.js"></script>
</body>
</html>
